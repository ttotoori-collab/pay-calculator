<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's in my wallet</title>
<meta name="description" content="알바별 시급·근무시간·주휴수당을 계산하는 알바비 계산기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <div class="window" id="window">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar" aria-label="사이드바">
      <div class="traffic" aria-hidden="true"><span class="tl red"></span><span class="tl yellow"></span><span class="tl green"></span></div>
      <nav id="sbNav"></nav>
    </aside>
    <div class="scrim" id="scrim" data-action="close-sidebar" hidden></div>

    <!-- 본문 -->
    <section class="main">
      <header class="toolbar" id="toolbar">
        <div class="tb-left">
          <button type="button" class="tb-btn sb-toggle" data-action="open-sidebar" aria-label="사이드바 열기"><span data-icon="sidebar"></span></button>
          <button type="button" class="tb-btn nav" data-action="prev-month" aria-label="이전 달"><span data-icon="chev-left"></span></button>
          <button type="button" class="tb-btn nav" data-action="next-month" aria-label="다음 달"><span data-icon="chev-right"></span></button>
          <div class="tb-title"><h1>WHAT'S IN MY WALLET</h1><span id="tbMonth"></span></div>
        </div>
        <div class="tb-tools">
          <button type="button" class="tb-btn combo" id="modeBtn" data-action="toggle-mode" title="보기 전환 (달력 / 리스트)" aria-label="보기 전환"></button>
          <button type="button" class="tb-btn combo" id="groupBtn" data-action="toggle-group" title="알바별 묶어보기" aria-label="알바별 묶어보기" aria-pressed="false"><span data-icon="group"></span><span data-icon="chev-down" class="mini"></span></button>
          <button type="button" class="tb-btn" data-action="share" title="월별 정산 이미지로 저장" aria-label="월별 정산 이미지로 저장"><span data-icon="share"></span></button>
          <button type="button" class="tb-btn" data-action="add-job" title="알바 등록" aria-label="알바 등록"><span data-icon="tag"></span></button>
          <div class="menu-anchor">
            <button type="button" class="tb-btn combo" id="menuBtn" data-action="menu" title="설정" aria-label="설정" aria-haspopup="menu" aria-expanded="false"><span data-icon="more"></span><span data-icon="chev-down" class="mini"></span></button>
            <div class="menu" id="menu" role="menu" hidden>
              <button type="button" role="menuitem" data-action="export">백업 파일 받기</button>
              <button type="button" role="menuitem" data-action="import">백업 파일 불러오기…</button>
              <div class="menu-sep"></div>
              <button type="button" role="menuitem" data-action="reset-all" class="danger">모든 기록 지우기…</button>
            </div>
          </div>
          <div class="search" id="search">
            <input type="search" id="searchInput" placeholder="근무 검색" aria-label="근무 검색" autocomplete="off">
            <button type="button" class="tb-btn" data-action="search" title="근무 검색" aria-label="근무 검색"><span data-icon="search"></span></button>
          </div>
        </div>
      </header>

      <div class="pane">
        <div class="content" id="content"></div>
        <!-- macOS 시트 -->
        <div class="sheet-wrap" id="sheetWrap" hidden>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
        </div>
      </div>

      <footer class="statusbar" id="statusbar"></footer>
    </section>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
