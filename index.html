<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💸 How much did I earn? 💸</title>
<meta name="description" content="알바별 시급·근무시간·주휴수당을 계산하는 알바비 계산기">

<!-- PWA: 홈 화면에 추가해서 앱처럼 쓰기 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b96c4" id="themeColor">
<script>
/* 화면 모드(낮/밤)는 그리기 전에 정해야 깜빡이지 않아요. 고른 값은 'wallet-theme'에 저장돼요.
   (근무 기록 키 seran-albailgi-v1 과는 별개예요) */
(function () {
  var t;
  try { t = localStorage.getItem('wallet-theme'); } catch (e) { /* 시크릿 모드 */ }
  if (t !== 'day' && t !== 'night') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', t === 'night' ? '#0b1b3a' : '#2b96c4');
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<!-- 아이폰 홈 화면 -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <div class="window" id="window">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar" aria-label="사이드바">
      <div class="traffic" aria-hidden="true"><span class="tl red"></span><span class="tl yellow"></span><span class="tl green"></span></div>
      <h1 class="sb-title">💸 HOW MUCH DID I EARN? 💸</h1>
      <nav id="sbNav"></nav>
    </aside>
    <div class="scrim" id="scrim" data-action="close-sidebar" hidden></div>

    <!-- 본문 -->
    <section class="main">
      <header class="toolbar" id="toolbar">
        <div class="tb-date">
          <div class="tb-date-l">
            <button type="button" class="tb-btn sb-toggle" id="sbToggle" data-action="toggle-sidebar" aria-label="사이드바" aria-expanded="false" aria-controls="sidebar"><span data-icon="sidebar"></span></button>
          </div>
          <div class="tb-date-c ym-anchor">
            <button type="button" class="tb-btn nav" data-action="prev-month" aria-label="이전 달"><span data-icon="chev-left"></span></button>
            <button type="button" class="month-btn" id="monthBtn" data-action="toggle-ym" aria-haspopup="dialog" aria-expanded="false" aria-controls="ymPicker" title="연도·월 고르기"></button>
            <button type="button" class="tb-btn nav" data-action="next-month" aria-label="다음 달"><span data-icon="chev-right"></span></button>
            <div class="ym" id="ymPicker" role="dialog" aria-label="연도·월 고르기" hidden></div>
          </div>
          <div class="tb-date-r">
            <button type="button" class="today-btn" id="todayBtn" data-action="go-today" title="이번 달로 돌아오기">오늘</button>
          </div>
        </div>
        <div class="tb-tools">
          <button type="button" class="tb-btn combo" id="modeBtn" data-action="toggle-mode" title="보기 전환 (달력 / 리스트)" aria-label="보기 전환"></button>
          <button type="button" class="tb-btn combo" id="groupBtn" data-action="toggle-group" title="알바별 묶어보기" aria-label="알바별 묶어보기" aria-pressed="false"><span data-icon="group"></span><span data-icon="chev-down" class="mini"></span></button>
          <button type="button" class="tb-btn" id="tagBtn" data-action="toggle-add-job" title="알바 등록" aria-label="알바 등록" aria-haspopup="dialog" aria-expanded="false"><span data-icon="tag"></span></button>
          <div class="menu-anchor">
            <button type="button" class="tb-btn combo" id="menuBtn" data-action="menu" title="설정" aria-label="설정" aria-haspopup="menu" aria-expanded="false"><span data-icon="more"></span><span data-icon="chev-down" class="mini"></span></button>
            <div class="menu" id="menu" role="menu" hidden>
              <div class="menu-label">기록 보관</div>
              <button type="button" role="menuitem" data-action="export">백업 파일 받기</button>
              <button type="button" role="menuitem" data-action="import">백업 파일 불러오기…</button>
              <div class="menu-note" id="storeNote"></div>
              <div class="menu-sep"></div>
              <div class="menu-label">가계부</div>
              <button type="button" role="menuitem" data-action="set-budget">이번 달 예산 정하기…</button>
              <button type="button" role="menuitem" data-action="manage-recur">매달 고정 지출…</button>
              <button type="button" role="menuitem" data-action="manage-cats">카테고리 관리…</button>
              <div class="menu-sep"></div>
              <button type="button" role="menuitem" data-action="reset-all" class="danger">모든 기록 지우기…</button>
              <div class="menu-sep"></div>
              <div class="menu-label">화면 모드</div>
              <button type="button" role="menuitemradio" data-action="theme" data-mode="auto" aria-checked="true"><span class="mk">✓</span>자동</button>
              <button type="button" role="menuitemradio" data-action="theme" data-mode="day" aria-checked="false"><span class="mk">✓</span>낮 · 유리창 너머 바다</button>
              <button type="button" role="menuitemradio" data-action="theme" data-mode="night" aria-checked="false"><span class="mk">✓</span>밤 · 심해 야광</button>
            </div>
          </div>
          <button type="button" class="tb-btn" data-action="share" title="월별 정산 이미지로 저장" aria-label="월별 정산 이미지로 저장"><span data-icon="share"></span></button>
        </div>
      </header>

      <div class="pane">
        <!-- 바닷속 수족관: 산호초와 헤엄치는 물고기 (ocean.js) -->
        <div class="sea" id="sea" aria-hidden="true">
          <div class="sea-water"></div>
          <img class="reef" src="assets/ocean/reef.webp" alt="" decoding="async" draggable="false">
        </div>
        <!-- 스크롤 영역(#contentScroll) 안의 젖빛 카드(#content)에 화면을 그려요 -->
        <div class="content" id="contentScroll"><div class="card" id="content"></div></div>
        <!-- macOS 시트 -->
        <div class="sheet-wrap" id="sheetWrap" hidden>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
        </div>
      </div>

      <footer class="statusbar" id="statusbar"></footer>
    </section>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
<script src="ocean.js"></script>
</body>
</html>
